<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全分岐ツリー｜10a狩人</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="repo" href="./">10a狩人 解析</a><span class="sep">/</span><span>全分岐ツリー</span></div></header>
<main class="wrap">
  <h1 id="ttl">全分岐ツリー</h1>
  <p id="meta" class="muted">読み込み中…</p>
  <div class="note">行を押すと、その先の分岐が開きます。左の白い数字は<b>出現率</b>（その分岐に進む確率）、右の青い数字は<b>村勝率</b>で、かっこ内は厳密な値（分数）です。背景の色は <b>昼</b>（黄）・<b>夜</b>（紺）・<b>朝</b>（結果、青灰）・<b>投票</b>（紫）を表します。<span class="lbl bad">人外の最善</span> は、狼と狂人が選ぶ手（村勝率が一番低くなる手）です。</div>
  <div class="toolbar">
    <label class="btn"><input type="checkbox" id="alt"> 人外の最善以外を隠す</label>
    <button class="btn" id="collapse" type="button">すべて閉じる</button>
  </div>
  <div id="tree"></div>
  <footer><a href="./">← 盤面ごとの結果に戻る</a></footer>
</main>
<script src="tree.js"></script>
</body>
</html>
